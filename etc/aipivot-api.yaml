Name: aipivot-api
Host: 0.0.0.0
Port: 8888
Mode: dev
Timeout: 30000

Log:
  ServiceName: aipivot-api
  Mode: console
  Level: info
  Encoding: plain

Postgres:
  Host: 127.0.0.1
  Port: 5432
  User: aipivot
  Password: aipivot
  Database: aipivot
  SSLMode: disable
  TimeZone: Asia/Shanghai
  MaxOpenConns: 20
  MaxIdleConns: 10

Redis:
  Addr: 127.0.0.1:6379
  Password: ""
  DB: 0

Telemetry:
  ServiceName: aipivot-api
  Environment: dev
  JaegerEndpoint: http://127.0.0.1:4317
  SampleRatio: 1.0

Metrics:
  Enabled: true
  Path: /metrics

Auth:
  AccessSecret: "aipivot-dev-secret-change-in-production"
  AccessExpire: 86400
  Issuer: aipivot

Migration:
  Enabled: true
  Path: migrations

LLM:
  BaseURL: "http://127.0.0.1:3000/v1"
  APIKey: "sk-your-api-key"
  ChatModel: "gpt-3.5-turbo"
  EmbeddingModel: "text-embedding-3-small"
  EmbeddingDim: 1536
  MaxTokens: 2048
  Temperature: 0.7
  TimeoutSeconds: 60
  ChatModels:
    - ID: "gpt-3.5-turbo"
      Name: "GPT-3.5 Turbo"
      Provider: "openai"
      MaxTokens: 16385
    - ID: "gpt-4o"
      Name: "GPT-4o"
      Provider: "openai"
      MaxTokens: 128000
    - ID: "gpt-4o-mini"
      Name: "GPT-4o Mini"
      Provider: "openai"
      MaxTokens: 128000
    - ID: "deepseek-chat"
      Name: "DeepSeek Chat"
      Provider: "deepseek"
      MaxTokens: 65536
  EmbeddingModels:
    - ID: "text-embedding-3-small"
      Name: "Embedding 3 Small (1536d)"
      Provider: "openai"
    - ID: "text-embedding-3-large"
      Name: "Embedding 3 Large (3072d)"
      Provider: "openai"

Worker:
  Enabled: true
  Concurrency: 5

Agent:
  Enabled: true
  MaxRounds: 5
