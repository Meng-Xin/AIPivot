Name: aipivot-api
Host: 0.0.0.0
Port: 8888
Mode: dev
Timeout: 30000

Log:
  ServiceName: aipivot-api
  Mode: console
  Level: info
  Encoding: plain

Postgres:
  Host: 127.0.0.1
  Port: 5432
  User: aipivot
  Password: aipivot
  Database: aipivot
  SSLMode: disable
  TimeZone: Asia/Shanghai
  MaxOpenConns: 20
  MaxIdleConns: 10

Redis:
  Addr: 127.0.0.1:6379
  Password: ""
  DB: 0

Telemetry:
  ServiceName: aipivot-api
  Environment: dev
  JaegerEndpoint: http://127.0.0.1:4317
  SampleRatio: 1.0

Metrics:
  Enabled: true
  Path: /metrics

Auth:
  AccessSecret: "aipivot-dev-secret-change-in-production"
  AccessExpire: 86400
  Issuer: aipivot

Migration:
  Enabled: true
  Path: migrations

LLM:
  Provider: "ark"
  BaseURL: "https://ark.cn-beijing.volces.com/api/v3"
  APIKeyEnv: "ARK_API_KEY"
  ChatModel: "deepseek-v4-pro-260425"
  EmbeddingModel: "text-embedding-3-small"
  EmbeddingDim: 1536
  MaxTokens: 2048
  Temperature: 0.7
  TimeoutSeconds: 60
  UseResponsesAPI: true
  EnableWebSearch: true
  WebSearchMaxKeyword: 3
  ChatModels:
    - ID: "deepseek-v4-pro-260425"
      Name: "DeepSeek V4 Pro (Doubao Ark)"
      Provider: "ark"
      MaxTokens: 1048576
    - ID: "deepseek-v4-flash-260425"
      Name: "DeepSeek V4 Flash (Doubao Ark)"
      Provider: "ark"
      MaxTokens: 1048576
  EmbeddingModels:
    - ID: "text-embedding-3-small"
      Name: "Embedding 3 Small (1536d)"
      Provider: "openai"
    - ID: "text-embedding-3-large"
      Name: "Embedding 3 Large (3072d)"
      Provider: "openai"

Worker:
  Enabled: true
  Concurrency: 5

Agent:
  Enabled: false
  MaxRounds: 5
  MultiAgentEnabled: false
  MaxWorkers: 3

# 模型计费配置（混合口径，美元/1K tokens）
ModelPricing:
  - Model: "deepseek-v4-pro-260425"
    PerK: 0.001
  - Model: "deepseek-v4-flash-260425"
    PerK: 0.001

# 每租户 Token 日配额限流（0 = 不限制）
RateLimit:
  DailyTokenLimit: 0
